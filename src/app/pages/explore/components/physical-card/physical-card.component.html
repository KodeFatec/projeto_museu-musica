<button type="button" class="card" (click)="choose.emit()">
  <span class="art" aria-hidden="true">
    @switch (item().kind) {
      @case ('vinyl') { <app-vinyl-disc class="piece piece--round" [label]="label" /> }
      @case ('cassette') { <app-cassette-tape class="piece" [spec]="tape" /> }
      @case ('cd') { <app-cd-disc class="piece piece--round" [label]="label" /> }
      @default {
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          @switch (item().kind) {
            @case ('scores') { <path d="M9 18V5l11-2v13M9 18a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 9 18Zm11-2a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 20 16Z" /> }
            @case ('instruments') { <path d="M4 17c0-3 2-5 5-5l7-7 3 3-7 7c0 3-2 5-5 5s-3-1-3-3Zm12-10 1.5-1.5" /> }
            @default { <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0" /> }
          }
        </svg>
      }
    }
  </span>
  <span class="body">
    <span class="title">{{ item().title }}</span>
    <span class="count">{{ item().count }} {{ item().unit }}</span>
  </span>
</button>
