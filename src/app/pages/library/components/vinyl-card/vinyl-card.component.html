<article class="card" tabindex="0" [attr.aria-label]="track().title + ', ' + artists() + (track().year ? ', ' + track().year : '')">
  <div class="stage">
    <div class="shadow"></div>
    <app-vinyl-disc class="disc" [label]="label()" />
    <span class="play" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
    </span>
  </div>
  <h3 class="title">{{ track().title }}</h3>
  <p class="meta">{{ artists() }}@if (track().year) { • <em>{{ track().year }}</em>}</p>
  @if (track().genre) {
    <span class="label-line">{{ track().genre }}</span>
  }
</article>
