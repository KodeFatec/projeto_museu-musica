<section class="section">
  <header class="head">
    <div class="titles">
      @if (accent() === 'heart') {
        <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
      } @else {
        <span class="dot" [class.dot--olive]="accent() === 'olive'"></span>
      }
      <h2 class="title">
        <span class="long">{{ title() }}</span>
        <span class="short">{{ shortTitle() ?? title() }}</span>
      </h2>
      @if (subtitle()) {
        <span class="subtitle">— {{ subtitle() }}</span>
      }
    </div>
    @if (action()) {
      <button type="button" class="action">
        <span class="long">{{ action() }}</span>
        <span class="short">{{ shortAction() ?? action() }}</span>
      </button>
    }
  </header>

  <div class="row" [style.--min]="minItem()" [style.--mobile]="mobileItem()">
    <ng-content />
  </div>
</section>
