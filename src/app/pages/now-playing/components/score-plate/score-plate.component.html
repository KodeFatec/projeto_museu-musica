<div class="head">
  <h3>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Foto &amp; Partitura
  </h3>
  @if (score().condition) {
    <span class="badge">{{ score().condition }}</span>
  }
</div>

<div class="plate">
  <div class="staves">
    <div class="staff">
      <span class="clef">𝄞</span>
      <span class="notes"><span>♩</span><span>♫</span><span>♬</span><span>♩</span><span>𝅘𝅥𝅯</span></span>
    </div>
    <div class="staff staff--bass">
      <span class="clef clef--bass">𝄢</span>
      <span class="notes notes--bass"><span>𝅗</span><span>♫</span><span>♩.</span><span>♪</span></span>
      @if (score().origin) {
        <span class="annotation">{{ score().origin }}</span>
      }
    </div>
    <div class="staff staff--sign">
      <span class="signature">{{ score().author }}@if (score().year) { • {{ score().year }}}</span>
    </div>
  </div>
  <div class="foot">
    <span>{{ score().title }}</span>
    @if (score().fileUrl; as url) {
      <a [href]="url" target="_blank" rel="noopener">Abrir arquivo</a>
    }
  </div>
</div>
