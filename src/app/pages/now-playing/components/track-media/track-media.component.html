<div class="media" [class.media--tape]="format() === 'cassette'" role="button" tabindex="0"
     [attr.aria-label]="playing() ? 'Pausar' : 'Tocar'"
     (click)="toggle.emit()" (keydown.enter)="toggle.emit()" (keydown.space)="$event.preventDefault(); toggle.emit()">
  <div class="glow"></div>

  @switch (format()) {
    @case ('vinyl') {
      <app-vinyl-disc class="piece" [label]="label()" [spinning]="playing()" />
      <span class="badge">{{ gold() ? 'Disco de Ouro • ' : '' }}Vinil • {{ track().year ?? 's/d' }}</span>
    }
    @case ('cd') {
      <app-cd-disc class="piece" [label]="label()" [spinning]="playing()" />
      <span class="badge">{{ gold() ? 'Disco de Ouro • ' : '' }}CD • {{ track().year }}</span>
    }
    @default {
      <app-cassette-tape class="piece" [spec]="spec()" [spinning]="playing()" />
      <span class="badge">{{ gold() ? 'Disco de Ouro • ' : '' }}Fita K7 • {{ track().year }}</span>
    }
  }
</div>
