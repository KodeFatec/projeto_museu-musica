<div class="disc">
  <div class="platter" [class.paused]="!spinning()" [class.platter--gold]="gold()">
    <div class="label" [style.background]="label().bg" [style.color]="label().fg" [style.borderColor]="label().ring">
      @for (line of label().lines; track $index) {
        <span class="line" [class.line--main]="$first">{{ line }}</span>
      }
    </div>
    <span class="spindle"></span>
  </div>
  <div class="shine"></div>
</div>
