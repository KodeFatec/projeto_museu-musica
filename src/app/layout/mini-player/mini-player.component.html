@if (track(); as t) {
  <aside class="player" aria-label="Player">
    <div class="thumb" [class.thumb--tape]="!isVinyl()" [class.paused]="!player.playing()">
      @if (isVinyl()) {
        <app-vinyl-disc [label]="label()!" [spinning]="player.playing()" />
      } @else {
        <app-cassette-tape [spec]="spec()!" [spinning]="player.playing()" />
      }
    </div>

    <button type="button" class="info" (click)="openPlayer()" aria-label="Abrir o player">
      <p class="title">{{ t.title }}</p>
      <p class="sub">{{ artists() }}@if (t.genre) { • {{ t.genre }}}</p>
    </button>

    <div class="controls">
      <button type="button" class="ghost skip" aria-label="Voltar 10 segundos" (click)="player.skip(-10)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
      </button>
      <button type="button" class="toggle" [attr.aria-label]="player.playing() ? 'Pausar' : 'Tocar'" (click)="player.toggle()">
        @if (player.playing()) {
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
        }
      </button>
      <button type="button" class="ghost skip" aria-label="Avançar 10 segundos" (click)="player.skip(10)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg>
      </button>
    </div>

    <div class="progress">
      <span>{{ time(player.elapsed()) }}</span>
      <input type="range" min="0" [max]="player.duration()" [value]="player.elapsed()" (input)="seek($event)" aria-label="Progresso da faixa"
             [style.--pct]="player.progress() * 100 + '%'" />
      <span>{{ time(player.duration()) }}</span>
    </div>

    <button type="button" class="ghost heart" [class.on]="player.liked()" [attr.aria-pressed]="player.liked()" aria-label="Favoritar" (click)="toggleFavorite()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
    </button>
  </aside>
}
